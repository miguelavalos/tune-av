name: TuneAV
options:
  bundleIdPrefix: com.avalsys
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    PRODUCT_NAME: TuneAV
    SWIFT_VERSION: "6.0"

packages:
  AccountAV:
    path: ../../../account-av
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0

schemes:
  TuneAV:
    build:
      targets:
        TuneAV: all
    run:
      config: Debug
      executable: TuneAV
    test:
      config: Debug
      targets:
        - TuneAVTests
        - TuneAVUITests
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true

targets:
  TuneAV:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: TuneAV
      - path: ../../shared/apple
    dependencies:
      - package: AccountAV
        product: AccountAV
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TuneAV/App/TuneAV.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(AVALSYS_APPLE_DEVELOPMENT_TEAM)"
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SDKROOT)/Developer/Library/Frameworks"
        INFOPLIST_FILE: TuneAV/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  TuneAVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TuneAVUITests
    dependencies:
      - target: TuneAV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TuneAVUITests
        PRODUCT_BUNDLE_IDENTIFIER: "$(TUNEAV_BUNDLE_IDENTIFIER).uitests"
        TARGETED_DEVICE_FAMILY: "1"

  TuneAVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuneAVTests
    dependencies:
      - target: TuneAV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TuneAVTests
        PRODUCT_BUNDLE_IDENTIFIER: "$(TUNEAV_BUNDLE_IDENTIFIER).tests"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TuneAV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TuneAV"
