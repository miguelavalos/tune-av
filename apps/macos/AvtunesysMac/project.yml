name: AvtunesysMac
options:
  bundleIdPrefix: com.avalsys
  deploymentTarget:
    macOS: "14.0"
targets:
  AvtunesysMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(AVTUNESYS_DISPLAY_NAME)
        AVACCOUNT_API_BASE_URL: $(AVACCOUNT_API_BASE_URL)
        AVACCOUNT_MANAGEMENT_URL: $(AVACCOUNT_MANAGEMENT_URL)
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: Sources
      - path: ../../../shared/apple
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AVTUNESYS_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: AV Tunesys
        PRODUCT_MODULE_NAME: AvtunesysMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        CODE_SIGNING_ALLOWED: NO

  AvtunesysMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AvtunesysMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: AvtunesysMacTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avalsys.avtunesys.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AV Tunesys.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AV Tunesys"

schemes:
  AvtunesysMac:
    build:
      targets:
        AvtunesysMac: all
    run:
      config: Debug
      executable: AvtunesysMac
    test:
      config: Debug
      targets:
        - AvtunesysMacTests
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true
