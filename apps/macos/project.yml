name: TuneAVMac
options:
  bundleIdPrefix: com.avalsys
  deploymentTarget:
    macOS: "26.2"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    PRODUCT_NAME: Tune AV
    SWIFT_VERSION: "6.0"

packages:
  AccountAV:
    path: ../../../account-av
  AppsAV:
    path: ../../../apps-av/apple
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1

schemes:
  TuneAVMac:
    build:
      targets:
        TuneAVMac: all
    run:
      config: Debug
      executable: TuneAVMac
    test:
      config: Debug
      targets:
        - TuneAVMacTests
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true

targets:
  TuneAVMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources
      - path: ../../shared/apple
      - path: Assets.xcassets
      - path: ../ios/TuneAV/Resources/en.lproj/Localizable.strings
        buildPhase: resources
      - path: ../ios/TuneAV/Resources/es.lproj/Localizable.strings
        buildPhase: resources
      - path: ../ios/TuneAV/Resources/fr.lproj/Localizable.strings
        buildPhase: resources
      - path: ../ios/TuneAV/Resources/de.lproj/Localizable.strings
        buildPhase: resources
      - path: ../ios/TuneAV/Resources/ca.lproj/Localizable.strings
        buildPhase: resources
    dependencies:
      - package: AccountAV
        product: AccountAV
      - package: AppsAV
        product: AVBrandFoundation
      - package: AppsAV
        product: AVAppShellFoundation
      - package: AppsAV
        product: AVLaunchFoundation
      - package: AppsAV
        product: AVSettingsFoundation
      - package: AppsAV
        product: AVAviFoundation
      - package: AppsAV
        product: AVPaywallFoundation
      - package: AppsAV
        product: AVDiagnosticsFoundation
      - package: ConvexMobile
        product: ConvexMobile
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(TUNEAV_DISPLAY_NAME)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        ACCOUNTAV_PUBLISHABLE_KEY: $(ACCOUNTAV_PUBLISHABLE_KEY)
        ACCOUNTAV_KEYCHAIN_SERVICE: $(ACCOUNTAV_KEYCHAIN_SERVICE)
        ACCOUNTAV_API_BASE_URL: $(ACCOUNTAV_API_BASE_URL)
        ACCOUNTAV_MANAGEMENT_URL: $(ACCOUNTAV_MANAGEMENT_URL)
        SUPPORTAV_BASE_URL: $(SUPPORTAV_BASE_URL)
        TUNEAV_CONFIG_ENVIRONMENT: $(TUNEAV_CONFIG_ENVIRONMENT)
        TUNEAV_CONVEX_URL: $(TUNEAV_CONVEX_URL)
        TUNEAV_MACOS_SENTRY_DSN: $(TUNEAV_MACOS_SENTRY_DSN)
        TUNEAV_DELETE_ACCOUNT_URL: $(TUNEAV_DELETE_ACCOUNT_URL)
        TUNEAV_TERMS_URL: $(TUNEAV_TERMS_URL)
        TUNEAV_PRIVACY_URL: $(TUNEAV_PRIVACY_URL)
        TUNEAV_OPEN_SOURCE_URL: $(TUNEAV_OPEN_SOURCE_URL)
        SUPPORT_EMAIL_TO: $(SUPPORT_EMAIL_TO)
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Supporting/TuneAVMac.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 935PM55U6R
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Supporting/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: TuneAVMac

  TuneAVMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TuneAVMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TuneAVMacTests
        PRODUCT_BUNDLE_IDENTIFIER: "$(TUNEAV_BUNDLE_IDENTIFIER).mac.tests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tune AV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tune AV"
