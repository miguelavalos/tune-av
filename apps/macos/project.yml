name: TuneAVMac
options:
  bundleIdPrefix: com.avalsys
  deploymentTarget:
    macOS: "14.0"
packages:
  AccountAV:
    path: ../../../account-av
  AppsAV:
    path: ../../../apps-av/apple
targets:
  TuneAVMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(TUNEAV_DISPLAY_NAME)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        ACCOUNTAV_PUBLISHABLE_KEY: $(ACCOUNTAV_PUBLISHABLE_KEY)
        TUNEAV_APP_IDENTIFIER_PREFIX: $(TUNEAV_APP_IDENTIFIER_PREFIX)
        TUNEAV_SUPPORT_EMAIL: $(TUNEAV_SUPPORT_EMAIL)
        SUPPORTAV_BASE_URL: $(SUPPORTAV_BASE_URL)
        ACCOUNTAV_API_BASE_URL: $(ACCOUNTAV_API_BASE_URL)
        ACCOUNTAV_MANAGEMENT_URL: $(ACCOUNTAV_MANAGEMENT_URL)
        TUNEAV_DELETE_ACCOUNT_URL: $(TUNEAV_DELETE_ACCOUNT_URL)
        TUNEAV_TERMS_URL: $(TUNEAV_TERMS_URL)
        TUNEAV_PRIVACY_URL: $(TUNEAV_PRIVACY_URL)
        TUNEAV_OPEN_SOURCE_URL: $(TUNEAV_OPEN_SOURCE_URL)
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: Sources
      - path: ../../shared/apple
      - path: Assets.xcassets
      - path: en.lproj/Localizable.strings
        buildPhase: resources
      - path: es.lproj/Localizable.strings
        buildPhase: resources
      - path: fr.lproj/Localizable.strings
        buildPhase: resources
      - path: de.lproj/Localizable.strings
        buildPhase: resources
      - path: ca.lproj/Localizable.strings
        buildPhase: resources
    dependencies:
      - package: AccountAV
        product: AccountAV
      - package: AppsAV
        product: AVBrandFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TUNEAV_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Tune AV
        PRODUCT_MODULE_NAME: TuneAVMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        CODE_SIGN_ENTITLEMENTS: Supporting/TuneAVMac.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(AVALSYS_APPLE_DEVELOPMENT_TEAM)"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

  TuneAVMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TuneAVMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TuneAVMacTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avalsys.tuneav.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tune AV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tune AV"

schemes:
  TuneAVMac:
    build:
      targets:
        TuneAVMac: all
    run:
      config: Debug
      executable: TuneAVMac
    test:
      config: Debug
      targets:
        - TuneAVMacTests
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true
