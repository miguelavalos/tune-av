name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/check-public-config-hygiene.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/check-public-config-hygiene.sh"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public config hygiene
        run: bun run config:hygiene

      - name: Test iOS
        run: bun run ios:ci
