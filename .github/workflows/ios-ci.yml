name: iOS CI

on:
  workflow_dispatch:
  # Every pull request starts this workflow, so the required checks
  # "Build and test iOS" and "Build and test macOS" always report. The
  # `changes` job skips both builds when no code changed; a skipped required
  # job counts as passing for branch protection.
  pull_request:
  push:
    branches:
      - main
    # A push builds unless every changed file is documentation or repository
    # metadata that no job reads. Any other file, including one nobody
    # thought of, is a build input. The `changes` job below applies the same
    # list to pull requests, in bash `case` syntax (`docs/**` there is
    # `docs/*`; `*.md` matches Markdown at the repository root only in both):
    # keep the two in sync.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - "t3.json"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A changed file is a code change unless it is documentation or
          # repository metadata that no job reads: the same list as the `push`
          # trigger's `paths-ignore` above, in bash `case` syntax. Everything
          # else builds, including a new file nobody thought of.
          is_code_change() {
            case "$1" in
              docs/* | LICENSE | t3.json | .github/CODEOWNERS | .github/ISSUE_TEMPLATE/* | .github/pull_request_template.md)
                return 1
                ;;
              */*.md)
                # Markdown inside a directory: XcodeGen bundles any non-source
                # file it finds under apps/ and shared/ as a resource, so it
                # builds, like every other file in those trees.
                return 0
                ;;
              *.md)
                # Markdown at the repository root: README, CHANGELOG, AGENTS...
                return 1
                ;;
            esac
            return 0
          }

          code=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Event '$EVENT_NAME' always counts as a code change."
            code=true
          elif ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "::warning::No merge base between $BASE_SHA and $HEAD_SHA; treating the pull request as a code change."
            code=true
          else
            echo "Base $BASE_SHA, head $HEAD_SHA, merge base $merge_base."
            # NUL-separated and without rename detection: a path is never
            # quoted or escaped, so every file matches its glob, and a file
            # moved into a documentation path still lists its old location.
            changed_list="$(mktemp)"
            if ! git diff -z --name-only --no-renames "$merge_base" "$HEAD_SHA" > "$changed_list"; then
              echo "::warning::Could not list the files changed since $merge_base; treating the pull request as a code change."
              code=true
            else
              echo "Changed files:"
              tr '\0' '\n' < "$changed_list"
              while IFS= read -r -d '' file; do
                if is_code_change "$file"; then
                  echo "Code change: $file"
                  code=true
                else
                  echo "Documentation or repository metadata: $file"
                fi
              done < "$changed_list"
            fi
          fi

          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test iOS
    needs: changes
    # The builds run unless the `changes` job positively reports no code change,
    # so a failed detection never lets a pull request merge without them.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false') }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout Account AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/account-av
          path: account-av

      - name: Checkout Apps AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/apps-av
          path: apps-av

      - name: Link local packages
        run: |
          ln -s "$GITHUB_WORKSPACE/account-av" "$GITHUB_WORKSPACE/../account-av"
          ln -s "$GITHUB_WORKSPACE/apps-av" "$GITHUB_WORKSPACE/../apps-av"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "22"
          cache: true

      - name: Install CI tools
        run: brew install ripgrep xcodegen

      - name: Cache iOS Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .derived-data/ios-ci/SourcePackages
          key: ${{ runner.os }}-ios-ci-${{ hashFiles('apps/ios/TuneAV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/ios/TuneAV.xcodeproj/project.pbxproj', 'apps/ios/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-ci-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: GitHub Actions pinning hygiene
        run: vp run ci:actions-pinning

      - name: GitHub Actions timeout hygiene
        run: vp run ci:workflow-timeouts

      - name: GitHub Actions permissions hygiene
        run: vp run ci:workflow-permissions

      - name: Public config hygiene
        run: vp run config:hygiene

      - name: Localization parity audit
        run: vp run i18n:audit

      - name: iOS platform security
        run: vp run ios:platform:security

      - name: iOS network privacy gate
        run: vp run ios:privacy:network

      - name: Test iOS
        run: TUNEAV_IOS_MAX_LAUNCH_READY_MS=25000 vp run ios:ci

      - name: Report iOS app size
        run: |
          set -euo pipefail
          vp run ios:size-report
          cat .derived-data/ios-ci/Reports/app-size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS test result bundle
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-ci-xcresults
          path: .derived-data/ios-ci/TestResults/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  macos-test:
    name: Build and test macOS
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false') }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout Account AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/account-av
          path: account-av

      - name: Checkout Apps AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/apps-av
          path: apps-av

      - name: Link local packages
        run: |
          ln -s "$GITHUB_WORKSPACE/account-av" "$GITHUB_WORKSPACE/../account-av"
          ln -s "$GITHUB_WORKSPACE/apps-av" "$GITHUB_WORKSPACE/../apps-av"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "22"
          cache: true

      - name: Cache macOS Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .derived-data/macos-ci/SourcePackages
          key: ${{ runner.os }}-macos-ci-${{ hashFiles('apps/macos/TuneAVMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/macos/TuneAVMac.xcodeproj/project.pbxproj', 'apps/macos/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-macos-ci-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Test macOS
        run: vp run macos:ci

      - name: Upload macOS test result bundle
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-ci-xcresult
          path: .derived-data/macos-ci/TestResults/TuneAVMac.xcresult
          if-no-files-found: ignore
          retention-days: 7
