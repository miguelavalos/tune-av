name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "apps/macos/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/macos-ci-test.sh"
      - "scripts/report-ios-app-size.sh"
      - "scripts/check-public-config-hygiene.sh"
      - "scripts/check-ios-network-privacy.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "apps/macos/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/macos-ci-test.sh"
      - "scripts/report-ios-app-size.sh"
      - "scripts/check-public-config-hygiene.sh"
      - "scripts/check-ios-network-privacy.sh"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache iOS Swift packages
        uses: actions/cache@v4
        with:
          path: .derived-data/ios-ci/SourcePackages
          key: ${{ runner.os }}-ios-ci-${{ hashFiles('apps/ios/TuneAV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/ios/TuneAV.xcodeproj/project.pbxproj', 'apps/ios/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-ci-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public config hygiene
        run: bun run config:hygiene

      - name: iOS network privacy gate
        run: bun run ios:privacy:network

      - name: Test iOS
        run: bun run ios:ci

      - name: Report iOS app size
        run: |
          bun run ios:size-report
          cat .derived-data/ios-ci/Reports/app-size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-xcresults
          path: .derived-data/ios-ci/TestResults/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  macos-test:
    name: Build and test macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache macOS Swift packages
        uses: actions/cache@v4
        with:
          path: .derived-data/macos-ci/SourcePackages
          key: ${{ runner.os }}-macos-ci-${{ hashFiles('apps/macos/TuneAVMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/macos/TuneAVMac.xcodeproj/project.pbxproj', 'apps/macos/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-macos-ci-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test macOS
        run: bun run macos:ci

      - name: Upload macOS test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-xcresult
          path: .derived-data/macos-ci/TestResults/TuneAVMac.xcresult
          if-no-files-found: ignore
          retention-days: 7
