name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/check-public-config-hygiene.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ci.yml"
      - "apps/ios/**"
      - "package.json"
      - "shared/**"
      - "scripts/ios-ci-test.sh"
      - "scripts/check-public-config-hygiene.sh"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache iOS build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .derived-data/ios-ci/SourcePackages
            .derived-data/ios-ci/Build
          key: ${{ runner.os }}-ios-ci-${{ hashFiles('apps/ios/TuneAV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/ios/TuneAV.xcodeproj/project.pbxproj', 'apps/ios/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-ci-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public config hygiene
        run: bun run config:hygiene

      - name: Test iOS
        run: bun run ios:ci

      - name: Upload iOS test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-xcresult
          path: .derived-data/ios-ci/TestResults/TuneAV.xcresult
          if-no-files-found: ignore
          retention-days: 7
