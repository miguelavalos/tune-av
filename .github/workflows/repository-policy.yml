name: Repository Policy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Verify repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Public config hygiene
        run: bash scripts/check-public-config-hygiene.sh

      - name: GitHub Actions pinning hygiene
        run: bash scripts/check-github-actions-pinning.sh

      - name: GitHub Actions permissions hygiene
        run: node scripts/check-github-workflow-permissions.mjs

      - name: GitHub Actions timeout hygiene
        run: node scripts/check-github-workflow-timeouts.mjs
