name: iOS Release Config Hygiene

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-release-config-hygiene.yml"
      - "apps/ios/Config/**"
      - "apps/ios/TuneAV.xcodeproj/project.pbxproj"
      - "package.json"
      - "scripts/check-ios-release-config-hygiene.sh"
      - "scripts/check-ios-privacy-release-gate.sh"
      - "scripts/check-ios-runtime-config.sh"
      - "scripts/generate-ios-ci-release-xcconfig.sh"
      - "scripts/generate-ios-local-xcconfig.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-release-config-hygiene.yml"
      - "apps/ios/Config/**"
      - "apps/ios/TuneAV.xcodeproj/project.pbxproj"
      - "package.json"
      - "scripts/check-ios-release-config-hygiene.sh"
      - "scripts/check-ios-privacy-release-gate.sh"
      - "scripts/check-ios-runtime-config.sh"
      - "scripts/generate-ios-ci-release-xcconfig.sh"
      - "scripts/generate-ios-local-xcconfig.sh"

concurrency:
  group: ios-release-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Validate release runtime config
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ACCOUNTAV_API_BASE_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_API_BASE_URL }}
      TUNEAV_API_BASE_URL: ${{ secrets.TUNEAV_PROD_TUNEAV_API_BASE_URL }}
      ACCOUNTAV_MANAGEMENT_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_MANAGEMENT_URL }}
      ACCOUNTAV_PUBLISHABLE_KEY: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_PUBLISHABLE_KEY }}
      TUNEAV_CONVEX_URL: ${{ secrets.TUNEAV_PROD_CONVEX_URL }}
      TUNEAV_REVENUECAT_PUBLIC_API_KEY: ${{ secrets.TUNEAV_REVENUECAT_PUBLIC_API_KEY }}
      TUNEAV_REVENUECAT_OFFERING_ID: ${{ vars.TUNEAV_REVENUECAT_OFFERING_ID || 'default' }}
      TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID: ${{ vars.TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID || '$rc_monthly' }}
      TUNEAV_PREMIUM_PRODUCT_IDS: ${{ vars.TUNEAV_PREMIUM_PRODUCT_IDS || 'tuneav_pro_monthly' }}
      TUNEAV_SUPPORT_EMAIL: ${{ vars.TUNEAV_SUPPORT_EMAIL || 'support@avalsys.com' }}
      SUPPORTAV_BASE_URL: ${{ vars.SUPPORTAV_BASE_URL || 'https://support-av.avalsys.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout Account AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/account-av
          path: account-av

      - name: Checkout Apps AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/apps-av
          path: apps-av

      - name: Link local packages
        run: |
          ln -s "$GITHUB_WORKSPACE/account-av" "$GITHUB_WORKSPACE/../account-av"
          ln -s "$GITHUB_WORKSPACE/apps-av" "$GITHUB_WORKSPACE/../apps-av"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate and validate release Local.xcconfig
        run: |
          set -euo pipefail
          mkdir -p build/release-privacy

          cleanup() {
            rm -f apps/ios/Config/Local.xcconfig
          }
          trap cleanup EXIT

          scripts/generate-ios-ci-release-xcconfig.sh --source ".github/workflows/ios-release-config-hygiene.yml"
          vp run ios:release-config:hygiene
          vp run ios:privacy:release -- --check-urls | tee build/release-privacy/privacy-release-gate.txt

          {
            echo "## iOS privacy release gate"
            echo
            echo '```text'
            cat build/release-privacy/privacy-release-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload privacy release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-privacy-release-gate
          path: build/release-privacy/privacy-release-gate.txt
          if-no-files-found: error
