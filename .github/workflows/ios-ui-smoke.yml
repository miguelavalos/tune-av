name: iOS UI Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"

concurrency:
  group: ios-ui-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Run iOS UI smoke tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache iOS UI smoke Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .derived-data/ios-ui-smoke/SourcePackages
          key: ${{ runner.os }}-ios-ui-smoke-${{ hashFiles('apps/ios/TuneAV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/ios/TuneAV.xcodeproj/project.pbxproj', 'apps/ios/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-ui-smoke-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public config hygiene
        run: bun run config:hygiene

      - name: Run UI smoke tests
        run: bun run ios:ui-smoke

      - name: Upload iOS UI smoke result bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-smoke-xcresults
          path: .derived-data/ios-ui-smoke/TestResults/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
