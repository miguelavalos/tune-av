name: iOS UI Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"

concurrency:
  group: ios-ui-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Run iOS UI smoke tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout Account AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/account-av
          path: account-av

      - name: Checkout Apps AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/apps-av
          path: apps-av

      - name: Link local packages
        run: |
          ln -s "$GITHUB_WORKSPACE/account-av" "$GITHUB_WORKSPACE/../account-av"
          ln -s "$GITHUB_WORKSPACE/apps-av" "$GITHUB_WORKSPACE/../apps-av"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "22"
          cache: true

      - name: Install CI tools
        run: brew install xcodegen

      - name: Cache iOS UI smoke Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .derived-data/ios-ui-smoke/SourcePackages
          key: ${{ runner.os }}-ios-ui-smoke-${{ hashFiles('apps/ios/TuneAV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apps/ios/TuneAV.xcodeproj/project.pbxproj', 'apps/ios/**/*.swift', 'shared/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-ui-smoke-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Public config hygiene
        run: vp run config:hygiene

      - name: Run UI smoke tests
        run: vp run ios:ui-smoke

      - name: Upload iOS UI smoke result bundles
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-ui-smoke-xcresults
          path: .derived-data/ios-ui-smoke/TestResults/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
