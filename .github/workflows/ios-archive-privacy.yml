name: iOS Archive Privacy Evidence

on:
  workflow_dispatch:

concurrency:
  group: ios-archive-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-privacy:
    name: Archive and validate privacy evidence
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ACCOUNTAV_API_BASE_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_API_BASE_URL }}
      ACCOUNTAV_MANAGEMENT_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_MANAGEMENT_URL }}
      ACCOUNTAV_PUBLISHABLE_KEY: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_PUBLISHABLE_KEY }}
      TUNEAV_REVENUECAT_PUBLIC_API_KEY: ${{ secrets.TUNEAV_REVENUECAT_PUBLIC_API_KEY }}
      TUNEAV_REVENUECAT_OFFERING_ID: ${{ vars.TUNEAV_REVENUECAT_OFFERING_ID || 'default' }}
      TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID: ${{ vars.TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID || '$rc_monthly' }}
      TUNEAV_PREMIUM_PRODUCT_IDS: ${{ vars.TUNEAV_PREMIUM_PRODUCT_IDS || 'tuneav_pro_monthly' }}
      TUNEAV_SUPPORT_EMAIL: ${{ vars.TUNEAV_SUPPORT_EMAIL || 'support@avalsys.com' }}
      SUPPORTAV_BASE_URL: ${{ vars.SUPPORTAV_BASE_URL || 'https://support-av.avalsys.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate release Local.xcconfig
        run: |
          scripts/generate-ios-ci-release-xcconfig.sh --source ".github/workflows/ios-archive-privacy.yml"
          bun run ios:release-config:hygiene

      - name: Archive iOS app
        run: |
          set -o pipefail
          mkdir -p build/release-privacy
          archive_path="$RUNNER_TEMP/TuneAV.xcarchive"
          derived_data_path="$RUNNER_TEMP/TuneAVDerivedData"

          xcodebuild archive \
            -project apps/ios/TuneAV.xcodeproj \
            -scheme TuneAV \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data_path" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            | tee build/release-privacy/archive.log

      - name: Validate archive privacy evidence
        run: |
          set -o pipefail
          archive_path="$RUNNER_TEMP/TuneAV.xcarchive"

          bun run ios:privacy:release -- \
            --archive "$archive_path" \
            --require-archive \
            --check-urls \
            | tee build/release-privacy/privacy-release-archive-gate.txt

          {
            echo "## iOS archive privacy evidence"
            echo
            echo '```text'
            cat build/release-privacy/privacy-release-archive-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive privacy evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-privacy-evidence
          path: |
            build/release-privacy/archive.log
            build/release-privacy/privacy-release-archive-gate.txt
          if-no-files-found: error

      - name: Clean generated release config
        if: always()
        run: rm -f apps/ios/Config/Local.xcconfig
