name: iOS Archive Privacy Evidence

on:
  workflow_dispatch:

concurrency:
  group: ios-archive-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-privacy:
    name: Archive and validate privacy evidence
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ACCOUNTAV_API_BASE_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_API_BASE_URL }}
      ACCOUNTAV_MANAGEMENT_URL: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_MANAGEMENT_URL }}
      ACCOUNTAV_PUBLISHABLE_KEY: ${{ secrets.TUNEAV_PROD_ACCOUNTAV_PUBLISHABLE_KEY }}
      TUNEAV_REVENUECAT_PUBLIC_API_KEY: ${{ secrets.TUNEAV_REVENUECAT_PUBLIC_API_KEY }}
      TUNEAV_REVENUECAT_OFFERING_ID: ${{ vars.TUNEAV_REVENUECAT_OFFERING_ID || 'default' }}
      TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID: ${{ vars.TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID || '$rc_monthly' }}
      TUNEAV_PREMIUM_PRODUCT_IDS: ${{ vars.TUNEAV_PREMIUM_PRODUCT_IDS || 'tuneav_pro_monthly' }}
      TUNEAV_SUPPORT_EMAIL: ${{ vars.TUNEAV_SUPPORT_EMAIL || 'support@avalsys.com' }}
      SUPPORTAV_BASE_URL: ${{ vars.SUPPORTAV_BASE_URL || 'https://support-av.avalsys.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release config secrets
        run: |
          missing=0
          for name in ACCOUNTAV_API_BASE_URL ACCOUNTAV_MANAGEMENT_URL ACCOUNTAV_PUBLISHABLE_KEY TUNEAV_REVENUECAT_PUBLIC_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing $name::Configure the GitHub secret required for iOS archive privacy evidence."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          case "$ACCOUNTAV_API_BASE_URL" in
            https://*) ;;
            *) echo "::error title=Invalid ACCOUNTAV_API_BASE_URL::Production API URL must use HTTPS."; exit 1 ;;
          esac
          case "$ACCOUNTAV_MANAGEMENT_URL" in
            https://*) ;;
            *) echo "::error title=Invalid ACCOUNTAV_MANAGEMENT_URL::Production management URL must use HTTPS."; exit 1 ;;
          esac
          case "$ACCOUNTAV_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "::error title=Invalid ACCOUNTAV_PUBLISHABLE_KEY::Production Clerk publishable key must start with pk_live_."; exit 1 ;;
          esac
          case "$TUNEAV_REVENUECAT_PUBLIC_API_KEY" in
            appl_*) ;;
            *) echo "::error title=Invalid TUNEAV_REVENUECAT_PUBLIC_API_KEY::RevenueCat iOS public key must start with appl_."; exit 1 ;;
          esac
          case "$TUNEAV_REVENUECAT_PUBLIC_API_KEY" in
            sk_*) echo "::error title=Invalid TUNEAV_REVENUECAT_PUBLIC_API_KEY::Do not use a RevenueCat secret key in iOS config."; exit 1 ;;
          esac

      - name: Generate release Local.xcconfig
        run: |
          escape_xcconfig_url() {
            printf '%s' "$1" | sed 's#/#$(XCCONFIG_SLASH)#g'
          }

          umask 077
          cat > apps/ios/Config/Local.xcconfig <<EOF
          // GENERATED by .github/workflows/ios-archive-privacy.yml
          // Do not commit this file.
          XCCONFIG_SLASH = /
          TUNEAV_CONFIG_ENVIRONMENT = prod
          TUNEAV_BUNDLE_IDENTIFIER = com.avalsys.tuneav
          AVALSYS_APPLE_DEVELOPMENT_TEAM = \$(inherited)
          ACCOUNTAV_PUBLISHABLE_KEY = $ACCOUNTAV_PUBLISHABLE_KEY
          TUNEAV_PREMIUM_PRODUCT_IDS = $TUNEAV_PREMIUM_PRODUCT_IDS
          TUNEAV_SUPPORT_EMAIL = $TUNEAV_SUPPORT_EMAIL
          SUPPORTAV_BASE_URL = $(escape_xcconfig_url "$SUPPORTAV_BASE_URL")
          ACCOUNTAV_API_BASE_URL = $(escape_xcconfig_url "$ACCOUNTAV_API_BASE_URL")
          TUNEAV_ENABLE_LISTENING_ANALYTICS_UPLOADS = 1
          ACCOUNTAV_MANAGEMENT_URL = $(escape_xcconfig_url "$ACCOUNTAV_MANAGEMENT_URL")
          TUNEAV_DELETE_ACCOUNT_URL = https:\$(XCCONFIG_SLASH)\$(XCCONFIG_SLASH)tune-av.avalsys.com\$(XCCONFIG_SLASH)delete-account
          TUNEAV_TERMS_URL = https:\$(XCCONFIG_SLASH)\$(XCCONFIG_SLASH)tune-av.avalsys.com\$(XCCONFIG_SLASH)terms
          TUNEAV_PRIVACY_URL = https:\$(XCCONFIG_SLASH)\$(XCCONFIG_SLASH)tune-av.avalsys.com\$(XCCONFIG_SLASH)privacy
          TUNEAV_OPEN_SOURCE_URL = https:\$(XCCONFIG_SLASH)\$(XCCONFIG_SLASH)github.com\$(XCCONFIG_SLASH)miguelavalos\$(XCCONFIG_SLASH)tune-av
          TUNEAV_REVENUECAT_PUBLIC_API_KEY = $TUNEAV_REVENUECAT_PUBLIC_API_KEY
          TUNEAV_REVENUECAT_OFFERING_ID = $TUNEAV_REVENUECAT_OFFERING_ID
          TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID = $TUNEAV_REVENUECAT_MONTHLY_PACKAGE_ID
          EOF

          chmod 600 apps/ios/Config/Local.xcconfig
          bun run ios:release-config:hygiene

      - name: Archive iOS app
        run: |
          set -o pipefail
          mkdir -p build/release-privacy
          archive_path="$RUNNER_TEMP/TuneAV.xcarchive"
          derived_data_path="$RUNNER_TEMP/TuneAVDerivedData"

          xcodebuild archive \
            -project apps/ios/TuneAV.xcodeproj \
            -scheme TuneAV \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data_path" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            | tee build/release-privacy/archive.log

      - name: Validate archive privacy evidence
        run: |
          set -o pipefail
          archive_path="$RUNNER_TEMP/TuneAV.xcarchive"

          bun run ios:privacy:release -- \
            --archive "$archive_path" \
            --require-archive \
            --check-urls \
            | tee build/release-privacy/privacy-release-archive-gate.txt

          {
            echo "## iOS archive privacy evidence"
            echo
            echo '```text'
            cat build/release-privacy/privacy-release-archive-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive privacy evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-privacy-evidence
          path: |
            build/release-privacy/archive.log
            build/release-privacy/privacy-release-archive-gate.txt
          if-no-files-found: error

      - name: Clean generated release config
        if: always()
        run: rm -f apps/ios/Config/Local.xcconfig
